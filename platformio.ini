; PocketCAN - Professional CAN Bus Analyzer
; Platform: M5Stack Tab5 (ESP32-P4)

[env:esp32p4_pioarduino]
platform = https://github.com/pioarduino/platform-espressif32.git#54.03.20
framework = arduino
board = esp32-p4-evboard
board_build.mcu = esp32p4
board_build.flash_mode = qio

upload_speed = 1500000
monitor_speed = 115200
; build_type = release
build_type = debug

; build_flags =
;     -DBOARD_HAS_PSRAM
;     -DCORE_DEBUG_LEVEL=0
;     -DARDUINO_USB_CDC_ON_BOOT=1
;     -DARDUINO_USB_MODE=1
;     -I include
;     -std=c++17
;     -O2                         ; Enable optimization level 2
;     -DNDEBUG                    ; Disable asserts
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=5
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -I include
    -std=c++17

lib_deps =
    https://github.com/M5Stack/M5Unified.git
    https://github.com/M5Stack/M5GFX.git
    lvgl/lvgl@^8.3.11

build_src_filter =
    +<*>
    -<lvgl_example/>

; Increase stack size for UI operations
board_build.partitions = default.csv
