; PocketCAN - Professional CAN Bus Analyzer
; Platform: M5Stack Tab5 (ESP32-P4)

[pocketcan_base]
platform = https://github.com/pioarduino/platform-espressif32.git#54.03.20
framework = arduino
board = esp32-p4-evboard
board_build.mcu = esp32p4
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions_pocketcan.csv

upload_speed = 1500000
monitor_speed = 115200

lib_deps =
    https://github.com/M5Stack/M5Unified.git
    https://github.com/M5Stack/M5GFX.git
    lvgl/lvgl@^8.3.11

[env:esp32p4_pioarduino]
extends = pocketcan_base
build_type = debug
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=5
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -I include
    -std=c++17

[env:esp32p4_release]
extends = pocketcan_base
build_type = release
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -I include
    -std=c++17
    -Os

[env:native]
platform = native
test_framework = unity
test_filter = test_*
build_flags =
    -std=c++17
    -D POCKETCAN_HOST_TEST
    -I src
    -I test
test_build_src = yes
build_src_filter =
    +<core/>
    +<utils/>
    -<core/can_sniffer.cpp>
    -<core/can_transmitter.cpp>
    -<core/device_emulator.cpp>
